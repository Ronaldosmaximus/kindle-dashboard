name: Kindle-Dashboard

on:
  schedule:
    - cron: "*/30 * * * *"   # alle 30 Minuten (GitHub kann sich ein paar Minuten verspäten)
  workflow_dispatch:          # manuell starten über "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bild erzeugen
        env:
          GARMIN_ICS_URL: ${{ secrets.GARMIN_ICS_URL }}
        run: |
          mkdir -p site
          python render.py site/dash.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # verhindert, dass GitHub den Zeitplan nach 60 Tagen ohne Commits abschaltet
      - uses: liskin/gh-workflow-keepalive@v1
